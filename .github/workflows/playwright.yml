name: Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Suite (fast | full | visual | regression)'
        required: false
        default: 'regression'

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGRESSION_SHARD_TOTAL: '6'

jobs:
  ci-fast:
    name: CI fast (SEO + pdfhint SEO smoke)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.profile == 'fast' || inputs.profile == 'full' || inputs.profile == 'regression' }}
    env:
      APP: mergedpdf
      PLAYWRIGHT_APP: mergedpdf
      SEO_LOGIN_PATHNAME: ${{ vars.SEO_LOGIN_PATHNAME || '/login' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Tag parity check
        run: npm run porting:tags
        env:
          SKIP_LEGACY_TAG_CHECK: '1'

      - name: Generate tests from features
        run: npm run bddgen

      - name: Run fast suite
        run: npm run test:ci-fast
        env:
          BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          MVPS_SLOT: ${{ vars.PLAYWRIGHT_MVPS_SLOT }}
          PDFHINT_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_BASE_URL }}
          PDFHINT_APP_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_APP_BASE_URL }}
          QAI_TOKEN_PARAM: ${{ secrets.QAI_TOKEN_PARAM }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fast
          path: |
            playwright-report/
            test-results/
            cucumber-report/
          if-no-files-found: ignore
          retention-days: 7

  ci-full:
    name: CI full (payment + users + emails + dashboard + pdfhint)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'full' }}
    needs: ci-fast
    env:
      APP: mergedpdf
      PLAYWRIGHT_APP: mergedpdf
      SEO_LOGIN_PATHNAME: ${{ vars.SEO_LOGIN_PATHNAME || '/login' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate tests from features
        run: npm run bddgen

      - name: Run full suite
        run: npm run test:ci-full
        env:
          BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          MVPS_SLOT: ${{ vars.PLAYWRIGHT_MVPS_SLOT }}
          PDFHINT_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_BASE_URL }}
          PDFHINT_APP_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_APP_BASE_URL }}
          QAI_TOKEN_PARAM: ${{ secrets.QAI_TOKEN_PARAM }}
          PLAYWRIGHT_PAYMENT_SMOKE: '1'
          PLAYWRIGHT_TRANSACTIONAL_PAYMENT_CONFIRMATION: '1'
          PLAYWRIGHT_PDFHINT_DASHBOARD_SMOKE: '1'
          PLAYWRIGHT_CRM_USER: ${{ secrets.PLAYWRIGHT_CRM_USER }}
          PLAYWRIGHT_CRM_PASSWORD: ${{ secrets.PLAYWRIGHT_CRM_PASSWORD }}
          PLAYWRIGHT_MAILPIT_USER: ${{ secrets.PLAYWRIGHT_MAILPIT_USER }}
          PLAYWRIGHT_MAILPIT_PASSWORD: ${{ secrets.PLAYWRIGHT_MAILPIT_PASSWORD }}
          PLAYWRIGHT_QA_API_KEY: ${{ secrets.PLAYWRIGHT_QA_API_KEY }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: |
            playwright-report/
            test-results/
            cucumber-report/
          if-no-files-found: ignore
          retention-days: 14

  regression-setup:
    name: Regression setup (bddgen)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'regression') }}
    needs: ci-fast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate tests from features
        run: npm run bddgen

      - name: Upload features-gen artifact
        uses: actions/upload-artifact@v4
        with:
          name: features-gen
          path: .features-gen/
          retention-days: 1

  ci-regression-functional:
    name: Regression functional (shard ${{ matrix.shard }}/6)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'regression') }}
    needs: regression-setup
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      REGRESSION_SHARD_TOTAL: '6'
      APP: mergedpdf
      PLAYWRIGHT_APP: mergedpdf
      PLAYWRIGHT_CI_WORKERS: '2'
      SEO_LOGIN_PATHNAME: ${{ vars.SEO_LOGIN_PATHNAME || '/login' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download features-gen artifact
        uses: actions/download-artifact@v4
        with:
          name: features-gen
          path: .features-gen

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run functional shard
        run: npm run test:ci-regression-functional-shard -- --shard=${{ matrix.shard }}/${{ env.REGRESSION_SHARD_TOTAL }}
        env:
          BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          MVPS_SLOT: ${{ vars.PLAYWRIGHT_MVPS_SLOT }}
          PDFHINT_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_BASE_URL }}
          PDFHINT_APP_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_APP_BASE_URL }}
          QAI_TOKEN_PARAM: ${{ secrets.QAI_TOKEN_PARAM }}
          PLAYWRIGHT_PAYMENT_SMOKE: '1'
          PLAYWRIGHT_TRANSACTIONAL_PAYMENT_CONFIRMATION: '1'
          PLAYWRIGHT_PDFHINT_DASHBOARD_SMOKE: '1'
          PLAYWRIGHT_CRM_USER: ${{ secrets.PLAYWRIGHT_CRM_USER }}
          PLAYWRIGHT_CRM_PASSWORD: ${{ secrets.PLAYWRIGHT_CRM_PASSWORD }}
          PLAYWRIGHT_MAILPIT_USER: ${{ secrets.PLAYWRIGHT_MAILPIT_USER }}
          PLAYWRIGHT_MAILPIT_PASSWORD: ${{ secrets.PLAYWRIGHT_MAILPIT_PASSWORD }}
          PLAYWRIGHT_QA_API_KEY: ${{ secrets.PLAYWRIGHT_QA_API_KEY }}

      - name: Upload shard report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            cucumber-report/
          if-no-files-found: ignore
          retention-days: 14

  ci-regression-visual:
    name: Regression visual
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'regression') }}
    needs: regression-setup
    env:
      APP: mergedpdf
      PLAYWRIGHT_APP: mergedpdf
      PLAYWRIGHT_CI_WORKERS: '2'
      SEO_LOGIN_PATHNAME: ${{ vars.SEO_LOGIN_PATHNAME || '/login' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download features-gen artifact
        uses: actions/download-artifact@v4
        with:
          name: features-gen
          path: .features-gen

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual regression
        run: npm run test:ci-regression-visual
        env:
          BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          MVPS_SLOT: ${{ vars.PLAYWRIGHT_MVPS_SLOT }}
          PDFHINT_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_BASE_URL }}
          PDFHINT_APP_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_APP_BASE_URL }}
          QAI_TOKEN_PARAM: ${{ secrets.QAI_TOKEN_PARAM }}

      - name: Upload visual report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression-visual
          path: |
            playwright-report/
            test-results/
            cucumber-report/
          if-no-files-found: ignore
          retention-days: 14

  ci-visual:
    name: CI visual (toHaveScreenshot baselines)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'visual' }}
    env:
      APP: mergedpdf
      PLAYWRIGHT_APP: mergedpdf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate tests from features
        run: npm run bddgen

      - name: Run visual suite (without --update-snapshots)
        run: npm run test:ci-visual
        env:
          BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
          MVPS_SLOT: ${{ vars.PLAYWRIGHT_MVPS_SLOT }}
          PDFHINT_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_BASE_URL }}
          PDFHINT_APP_BASE_URL: ${{ vars.PLAYWRIGHT_PDFHINT_APP_BASE_URL }}
          QAI_TOKEN_PARAM: ${{ secrets.QAI_TOKEN_PARAM }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
            cucumber-report/
          if-no-files-found: ignore
          retention-days: 14
